<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Advocate Charcoal & Midnight Slate Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2033" />
      <stop offset="55%" stop-color="#161827" />
      <stop offset="100%" stop-color="#12141F" />
    </linearGradient>

    <!-- Soft Brass Aura -->
    <radialGradient id="auraGrad" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#E3B341" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#D4A017" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#12141F" stop-opacity="0" />
    </radialGradient>

    <!-- Legal Brass Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF8D" />
      <stop offset="45%" stop-color="#E3B341" />
      <stop offset="100%" stop-color="#C48B11" />
    </linearGradient>

    <!-- Vertical Brass Pillar Gradient -->
    <linearGradient id="goldVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF0C8" />
      <stop offset="35%" stop-color="#E3B341" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Parchment Folio Pages -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="80%" stop-color="#EDEAE3" />
      <stop offset="100%" stop-color="#D6D1C9" />
    </linearGradient>
    <linearGradient id="pageRight" x1="100%" y1="0%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="80%" stop-color="#EDEAE3" />
      <stop offset="100%" stop-color="#D6D1C9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="238" r="185" fill="url(#auraGrad)" />

  <!-- Subtle Inner Brass Bezel -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#E3B341" stroke-width="2" stroke-opacity="0.24" />

  <!-- Chamber Seal Ring + Cardinal Ticks -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#E3B341" stroke-width="2" stroke-opacity="0.32" />
  <circle cx="256" cy="256" r="194" fill="none" stroke="#E3B341" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="6 10" />
  <g stroke="#E3B341" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="42" x2="256" y2="56" />
    <line x1="256" y1="456" x2="256" y2="470" />
    <line x1="42" y1="256" x2="56" y2="256" />
    <line x1="456" y1="256" x2="470" y2="256" />
  </g>

  <!-- Central Scales & Advocate Nib Crest -->
  <g id="scales-crest">
    <!-- Central Pillar -->
    <rect x="250" y="122" width="12" height="196" rx="6" fill="url(#goldVert)" />

    <!-- Advocate Fountain Nib Finial -->
    <path d="M 256 76 L 274 110 L 264 128 L 248 128 L 238 110 Z" fill="url(#goldGrad)" />
    <line x1="256" y1="78" x2="256" y2="106" stroke="#1D2033" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="256" cy="109" r="3.5" fill="#1D2033" />

    <!-- Architectural Balance Beam -->
    <path d="M 134 156 Q 196 138 256 146 Q 316 138 378 156" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="256" cy="146" r="9" fill="#FAF0C8" stroke="#A16207" stroke-width="2.5" />
    <circle cx="134" cy="156" r="7" fill="#EDC752" />
    <circle cx="378" cy="156" r="7" fill="#EDC752" />

    <!-- Left Scale Strings & Pan -->
    <g>
      <line x1="134" y1="158" x2="98" y2="232" stroke="#E3B341" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <line x1="134" y1="158" x2="170" y2="232" stroke="#E3B341" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <line x1="134" y1="158" x2="134" y2="232" stroke="#E3B341" stroke-width="2" stroke-linecap="round" opacity="0.45" />
      <path d="M 90 232 Q 134 266 178 232 Z" fill="url(#goldGrad)" />
      <line x1="92" y1="232" x2="176" y2="232" stroke="#FAF0C8" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Right Scale Strings & Pan -->
    <g>
      <line x1="378" y1="158" x2="342" y2="232" stroke="#E3B341" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <line x1="378" y1="158" x2="414" y2="232" stroke="#E3B341" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <line x1="378" y1="158" x2="378" y2="232" stroke="#E3B341" stroke-width="2" stroke-linecap="round" opacity="0.45" />
      <path d="M 334 232 Q 378 266 422 232 Z" fill="url(#goldGrad)" />
      <line x1="336" y1="232" x2="420" y2="232" stroke="#FAF0C8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Open CaseBook Legal Ledger -->
  <g id="casebook-folio">
    <!-- Hardcover Brass Binding -->
    <path d="M 106 346 L 256 392 L 406 346 L 406 364 L 256 410 L 106 364 Z" fill="url(#goldGrad)" />

    <!-- Bookmark Ribbon -->
    <path d="M 247 392 L 265 392 L 265 434 L 256 423 L 247 434 Z" fill="#EDC752" />

    <!-- Left Parchment Page -->
    <path d="M 118 278 C 166 278, 218 292, 253 320 L 253 386 C 216 360, 166 346, 118 346 Z" fill="url(#pageLeft)" />
    <!-- Right Parchment Page -->
    <path d="M 394 278 C 346 278, 294 292, 259 320 L 259 386 C 296 360, 346 346, 394 346 Z" fill="url(#pageRight)" />

    <!-- Spine Shadow & Gold Crease -->
    <line x1="256" y1="318" x2="256" y2="388" stroke="#A16207" stroke-width="3" stroke-linecap="round" />

    <!-- Crisp Docket Lines on Pages -->
    <g stroke="#8B93B8" stroke-width="3" stroke-linecap="round" opacity="0.45">
      <path d="M 138 300 C 172 300, 206 308, 232 324" fill="none" />
      <path d="M 138 318 C 172 318, 206 326, 232 342" fill="none" />
      <path d="M 374 300 C 340 300, 306 308, 280 324" fill="none" />
      <path d="M 374 318 C 340 318, 306 326, 280 342" fill="none" />
    </g>
  </g>
</svg>
